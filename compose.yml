services:
  easyfrete-api:
    image: ghcr.io/mayyzenacs/easyfrete-api:latest
    container_name: easyfrete-api
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks: [main_network]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  easyfrete-web:
    image: ghcr.io/mayyzenacs/easyfrete-web:latest
    container_name: easyfrete-web
    pull_policy: always
    restart: unless-stopped
    networks: [main_network]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  main_network:
    external: true
