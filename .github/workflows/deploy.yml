name: CI/CD — Easy Frete

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  ci-backend:
    name: CI Back-end (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run NUnit tests
        run: dotnet test backend/EasyFrete.slnx -c Release --verbosity normal

  ci-frontend:
    name: CI Front-end (Bun + Vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint

      - name: Typecheck & Production Build
        run: bun run build

  build-and-push:
    name: Build & Push GHCR (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            file: backend/EasyFrete.Api/Dockerfile
          - name: web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/easyfrete-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push private arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=easyfrete-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=easyfrete-${{ matrix.name }}
          provenance: false

  deploy:
    name: Deploy to Oracle VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            compose.prod.yml
            deploy/nginx/sites_conf/easyfrete.conf
            deploy/nginx/snippets/ef_proxy.conf
          sparse-checkout-cone-mode: false

      - name: Validate secrets and configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          for var in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS GHCR_READ_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret obrigatorio nao configurado no environment production: $var"
              exit 1
            fi
          done

          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9._:-]+$ ]] || [[ ! "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Formato invalido em VPS_HOST, VPS_PORT ou VPS_USER."
            exit 1
          fi

          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          cat > "$RUNNER_TEMP/ssh_config" <<EOF
          Host vps
            HostName $VPS_HOST
            Port $VPS_PORT
            User $VPS_USER
            IdentityFile "$RUNNER_TEMP/deploy_key"
            IdentitiesOnly yes
            UserKnownHostsFile "$RUNNER_TEMP/known_hosts"
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF

      - name: Upload staged deployment files to VPS
        run: |
          set -euo pipefail
          SSH_CFG="$RUNNER_TEMP/ssh_config"
          ssh -F "$SSH_CFG" vps 'mkdir -p "$HOME/nginx/sites/easyfrete/data" "$HOME/nginx/sites/easyfrete/.staging" "$HOME/nginx/sites_conf" "$HOME/nginx/snippets"'
          scp -F "$SSH_CFG" \
            compose.prod.yml \
            deploy/nginx/sites_conf/easyfrete.conf \
            deploy/nginx/snippets/ef_proxy.conf \
            vps:nginx/sites/easyfrete/.staging/

      - name: Roll out containers and reload Nginx safely
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE_SCRIPT=$(cat <<'EOF'
          set -euo pipefail
          IFS= read -r GHCR_TOKEN
          WORK_TMP=$(mktemp -d)

          NGINX_DIR="$HOME/nginx"
          DEPLOY_DIR="$NGINX_DIR/sites/easyfrete"
          STAGING_DIR="$DEPLOY_DIR/.staging"
          NGINX_CONF="$NGINX_DIR/sites_conf/easyfrete.conf"
          NGINX_SNIPPET="$NGINX_DIR/snippets/ef_proxy.conf"
          CF_SNIPPET="$NGINX_DIR/snippets/cloudflare_realip.conf"

          cleanup() {
            rm -rf "$WORK_TMP" "$STAGING_DIR"
          }
          trap cleanup EXIT

          cd "$DEPLOY_DIR"

          if [ ! -f .env ]; then
            echo "::error::Arquivo $DEPLOY_DIR/.env nao encontrado na VPS. Crie-o manualmente antes do deploy."
            exit 1
          fi

          if [ ! -f "$CF_SNIPPET" ]; then
            echo "::error::Snippet $CF_SNIPPET nao encontrado na VPS. Rode $NGINX_DIR/update_cloudflare_ips.sh antes do deploy."
            exit 1
          fi

          CURRENT_OWNER=$(stat -c '%u:%g' "$DEPLOY_DIR/data")
          if [ "$CURRENT_OWNER" != "1654:1654" ]; then
            sudo -n chown -R 1654:1654 "$DEPLOY_DIR/data"
            sudo -n chmod 700 "$DEPLOY_DIR/data"
          fi

          docker compose --project-directory "$DEPLOY_DIR" -f "$STAGING_DIR/compose.prod.yml" config --quiet
          mv -f "$STAGING_DIR/compose.prod.yml" "$DEPLOY_DIR/compose.yml"

          export DOCKER_CONFIG="$WORK_TMP"
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN

          docker compose pull

          if ! docker compose up -d --remove-orphans --wait --wait-timeout 90; then
            echo "::error::Falha no rollout ou healthcheck dos containers."
            docker compose ps
            docker compose logs --tail=60
            exit 1
          fi

          if [ -f "$NGINX_CONF" ]; then cp "$NGINX_CONF" "$WORK_TMP/easyfrete.conf.bak"; fi
          if [ -f "$NGINX_SNIPPET" ]; then cp "$NGINX_SNIPPET" "$WORK_TMP/ef_proxy.conf.bak"; fi

          mv -f "$STAGING_DIR/easyfrete.conf" "$NGINX_CONF"
          mv -f "$STAGING_DIR/ef_proxy.conf" "$NGINX_SNIPPET"

          if docker exec nginx_master nginx -t; then
            docker exec nginx_master nginx -s reload
          else
            echo "::error::Validacao do Nginx falhou. Revertendo configs..."
            if [ -f "$WORK_TMP/easyfrete.conf.bak" ]; then
              cp "$WORK_TMP/easyfrete.conf.bak" "$NGINX_CONF"
            else
              rm -f "$NGINX_CONF"
            fi
            if [ -f "$WORK_TMP/ef_proxy.conf.bak" ]; then
              cp "$WORK_TMP/ef_proxy.conf.bak" "$NGINX_SNIPPET"
            else
              rm -f "$NGINX_SNIPPET"
            fi
            exit 1
          fi

          docker compose ps
          docker image prune -f --filter "until=168h"
          EOF
          )

          printf '%s\n' "$GHCR_READ_TOKEN" | ssh -F "$RUNNER_TEMP/ssh_config" vps \
            "REGISTRY=$(printf '%q' "$REGISTRY") GHCR_USER=$(printf '%q' "$GHCR_USER") bash -c $(printf '%q' "$REMOTE_SCRIPT")"

      - name: Clean up ephemeral SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/ssh_config"
