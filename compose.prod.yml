services:
  easyfrete-api:
    image: ghcr.io/mayyzenacs/easyfrete-api:latest
    container_name: easyfrete-api
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - main_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.aspnet
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  easyfrete-web:
    image: ghcr.io/mayyzenacs/easyfrete-web:latest
    container_name: easyfrete-web
    pull_policy: always
    restart: unless-stopped
    networks:
      - main_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  main_network:
    external: true
