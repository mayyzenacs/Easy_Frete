limit_req_zone $binary_remote_addr zone=ef_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ef_sync:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ef_api:10m rate=30r/m;

server {
    listen 80;
    server_name easyfrete.mayradev.me;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name easyfrete.mayradev.me;

    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/snippets/cloudflare_realip.conf;

    limit_req_status 429;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Headers de segurança (mantidos no bloco server; não usar add_header nas locations)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Upstreams via variáveis para resolução dinâmica DNS no Docker (não derruba o nginx_master se o container parar)
    set $ef_api http://easyfrete-api:8080;
    set $ef_web http://easyfrete-web:8080;

    # Bloqueio silencioso (444) de scanners/bots comuns
    location ~ /\.(env|git|htaccess|svn) {
        return 444;
    }

    location ~* ^/(wp-login\.php|wp-admin|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|cgi-bin) {
        return 444;
    }

    location ~* \.php$ {
        return 444;
    }

    location /api/v1/auth/ {
        limit_req zone=ef_auth burst=5 nodelay;
        include /etc/nginx/snippets/ef_proxy.conf;
        proxy_pass $ef_api;
    }

    location /api/v1/produtos/sync-lote {
        limit_req zone=ef_sync burst=30 nodelay;
        client_max_body_size 5m;
        include /etc/nginx/snippets/ef_proxy.conf;
        proxy_pass $ef_api;
    }

    location /api/v1/tarifas/magalu/sync {
        limit_req zone=ef_sync burst=30 nodelay;
        client_max_body_size 5m;
        include /etc/nginx/snippets/ef_proxy.conf;
        proxy_pass $ef_api;
    }

    location /api/ {
        limit_req zone=ef_api burst=20 nodelay;
        include /etc/nginx/snippets/ef_proxy.conf;
        proxy_pass $ef_api;
    }

    location / {
        include /etc/nginx/snippets/ef_proxy.conf;
        proxy_pass $ef_web;
    }
}
